<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código QR - Literatura Realista Ecuador</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .qr-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        h2 {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: normal;
        }
        
        .qr-code {
            margin: 30px auto;
            padding: 20px;
            background: white;
            border: 3px solid #667eea;
            border-radius: 15px;
            display: inline-block;
        }
        
        .url {
            color: #667eea;
            font-size: 14px;
            word-break: break-all;
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            font-family: monospace;
        }
        
        .instructions {
            color: #666;
            margin-top: 25px;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .print-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .print-button:hover {
            background: #5568d3;
        }
        
        @media print {
            body {
                background: white;
            }
            
            .print-button {
                display: none;
            }
            
            .qr-container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="icon">📚</div>
        <h1>Literatura Realista Ecuatoriana</h1>
        <h2>Escanea el código QR para acceder</h2>
        
        <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://alejandrocordova1993.github.io/literatura-realista-ecuador/" 
                 alt="QR Code" 
                 width="300" 
                 height="300">
        </div>
        
        <div class="url">
            https://alejandrocordova1993.github.io/literatura-realista-ecuador/
        </div>
        
        <div class="instructions">
            <strong>Instrucciones:</strong><br>
            1. Abre la cámara de tu celular<br>
            2. Apunta al código QR<br>
            3. Toca la notificación que aparece<br>
            4. ¡Explora la presentación interactiva!
        </div>
        
        <button class="print-button" onclick="window.print()">
            🖨️ Imprimir este código QR
        </button>
    </div>
</body>
</html>
