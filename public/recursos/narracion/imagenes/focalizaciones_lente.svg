<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#F3F1EA; font-family:'Public Sans', -apple-system, sans-serif;">
  <defs>
    <style>
      .title { font-family: 'Public Sans', sans-serif; font-size: 26px; font-weight: 700; fill: #071B33; letter-spacing: -0.02em; }
      .mono-label { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; fill: #5C636C; letter-spacing: 0.08em; text-transform: uppercase; }
      .col-title { font-family: 'Public Sans', sans-serif; font-size: 18px; font-weight: 700; fill: #071B33; }
      .formula-badge { font-family: 'DM Mono', monospace; font-size: 17px; font-weight: 700; fill: #071B33; }
      .body-text { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; fill: #101820; line-height: 1.5; }
      .body-meta { font-family: 'DM Mono', monospace; font-size: 12px; fill: #5C636C; }
      .grid-line { stroke: #D7D9D6; stroke-width: 1; }
      .accent-dot { fill: #D83A32; }
      .optic-cone { fill: rgba(35, 103, 209, 0.08); stroke: #2367D1; stroke-width: 1.5; }
      .optic-zero { fill: rgba(18, 60, 105, 0.08); stroke: #123C69; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .optic-ext { fill: rgba(7, 27, 51, 0.06); stroke: #071B33; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Border container -->
  <rect x="40" y="30" width="1120" height="615" fill="#FAF9F5" stroke="#D7D9D6" stroke-width="1" rx="4" />

  <!-- Header section -->
  <circle cx="70" cy="65" r="4" class="accent-dot" />
  <text x="85" y="70" class="mono-label">GÉRARD GENETTE &amp; MIEKE BAL · REGULACIÓN PERCEPTUAL</text>
  <text x="70" y="105" class="title">LAS TRES LENTES DE FOCALIZACIÓN NARRATIVA</text>
  <text x="70" y="128" class="mono-label" style="fill:#5C636C;">DESLINDE EPISTEMOLÓGICO: ¿QUIÉN HABLA? (VOZ ENUNCIATIVA) FRENTE A ¿QUIÉN PERCIBE? (LENTE FOCAL)</text>
  
  <line x1="70" y1="145" x2="1130" y2="145" class="grid-line" />
  <circle cx="1130" cy="145" r="3.5" class="accent-dot" />

  <!-- COLUMN 1: FOCALIZACIÓN CERO -->
  <g transform="translate(65, 165)">
    <rect x="0" y="0" width="340" height="435" fill="#FFFFFF" stroke="#D7D9D6" stroke-width="1" rx="4" />
    
    <!-- Header Card -->
    <rect x="0" y="0" width="340" height="65" fill="#F3F1EA" rx="4" />
    <text x="20" y="28" class="mono-label" style="font-size:11px;">01 / VISIÓN PANORÁMICA</text>
    <text x="20" y="52" class="col-title">FOCALIZACIÓN CERO</text>

    <!-- Formula Box -->
    <rect x="20" y="80" width="300" height="45" fill="#FAF9F5" stroke="#123C69" stroke-width="1" rx="2" />
    <text x="35" y="108" class="formula-badge">N &gt; P (Narrador &gt; Personaje)</text>

    <!-- Geometric Optical Diagram -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="300" height="110" fill="#FAF9F5" stroke="#D7D9D6" stroke-width="0.5" rx="2" />
      <!-- Omniscient Panoramic Cone -->
      <polygon points="150,15 20,95 280,95" class="optic-zero" />
      <circle cx="150" cy="15" r="5" fill="#071B33" />
      <text x="150" y="8" font-family="DM Mono" font-size="10" fill="#071B33" text-anchor="middle">OJO TRASCENDENTE</text>
      <!-- Target elements inside cone -->
      <circle cx="90" cy="75" r="4" fill="#123C69" />
      <circle cx="150" cy="75" r="4" fill="#123C69" />
      <circle cx="210" cy="75" r="4" fill="#123C69" />
      <text x="150" y="92" font-family="DM Mono" font-size="10" fill="#5C636C" text-anchor="middle">PERSONAJES &amp; SECRETOS ACCESIBLES</text>
    </g>

    <!-- Descriptions -->
    <g transform="translate(20, 270)">
      <text x="0" y="18" class="body-text">El narrador no se somete a los límites de ninguna</text>
      <text x="0" y="38" class="body-text">conciencia. Sabe pasado, futuro y pensamientos</text>
      <text x="0" y="58" class="body-text">íntimos simultáneos de todos los agentes.</text>

      <line x1="0" y1="75" x2="300" y2="75" class="grid-line" />

      <text x="0" y="95" class="body-meta">RÉGIMEN: Omnisciencia clásica</text>
      <text x="0" y="115" class="body-meta">ALCANCE: Universal e ilimitado</text>
      <text x="0" y="135" class="body-meta" style="fill:#123C69; font-weight:600;">EJEMPLO: Clarín (La Regenta) / Tolstói</text>
    </g>
  </g>

  <!-- COLUMN 2: FOCALIZACIÓN INTERNA -->
  <g transform="translate(430, 165)">
    <rect x="0" y="0" width="340" height="435" fill="#FFFFFF" stroke="#D7D9D6" stroke-width="1" rx="4" />
    
    <!-- Header Card -->
    <rect x="0" y="0" width="340" height="65" fill="#F3F1EA" rx="4" />
    <text x="20" y="28" class="mono-label" style="font-size:11px;">02 / FILTRO SUBJETIVO</text>
    <text x="20" y="52" class="col-title">FOCALIZACIÓN INTERNA</text>

    <!-- Formula Box -->
    <rect x="20" y="80" width="300" height="45" fill="#FAF9F5" stroke="#2367D1" stroke-width="1" rx="2" />
    <text x="35" y="108" class="formula-badge" style="fill:#2367D1;">N = P (Narrador = Personaje)</text>

    <!-- Geometric Optical Diagram -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="300" height="110" fill="#FAF9F5" stroke="#D7D9D6" stroke-width="0.5" rx="2" />
      <!-- Character Internal Cone -->
      <polygon points="50,55 250,20 250,90" class="optic-cone" />
      <circle cx="50" cy="55" r="6" fill="#2367D1" />
      <text x="50" y="78" font-family="DM Mono" font-size="10" fill="#2367D1" text-anchor="middle">PERSONAJE</text>
      <circle cx="200" cy="45" r="4" fill="#071B33" />
      <text x="200" y="65" font-family="DM Mono" font-size="10" fill="#5C636C" text-anchor="middle">CAMPO PERCEPTUAL</text>
      <text x="150" y="102" font-family="DM Mono" font-size="10" fill="#D83A32" text-anchor="middle">LIMITADO A SUS SENTIDOS</text>
    </g>

    <!-- Descriptions -->
    <g transform="translate(20, 270)">
      <text x="0" y="18" class="body-text">El relato se restringe estrictamente a lo que el</text>
      <text x="0" y="38" class="body-text">personaje ve, oye o siente. Puede ser fija (1 mente),</text>
      <text x="0" y="58" class="body-text">variable (varias mentes) o múltiple (mismo hecho).</text>

      <line x1="0" y1="75" x2="300" y2="75" class="grid-line" />

      <text x="0" y="95" class="body-meta">RÉGIMEN: Subjetividad o prisma sensorial</text>
      <text x="0" y="115" class="body-meta">ALCANCE: Restringido a la conciencia</text>
      <text x="0" y="135" class="body-meta" style="fill:#123C69; font-weight:600;">EJEMPLO: Camus (El extranjero) / Joyce</text>
    </g>
  </g>

  <!-- COLUMN 3: FOCALIZACIÓN EXTERNA -->
  <g transform="translate(795, 165)">
    <rect x="0" y="0" width="340" height="435" fill="#FFFFFF" stroke="#D7D9D6" stroke-width="1" rx="4" />
    
    <!-- Header Card -->
    <rect x="0" y="0" width="340" height="65" fill="#F3F1EA" rx="4" />
    <text x="20" y="28" class="mono-label" style="font-size:11px;">03 / CÁMARA CONDUCTISTA</text>
    <text x="20" y="52" class="col-title">FOCALIZACIÓN EXTERNA</text>

    <!-- Formula Box -->
    <rect x="20" y="80" width="300" height="45" fill="#FAF9F5" stroke="#071B33" stroke-width="1" rx="2" />
    <text x="35" y="108" class="formula-badge">N &lt; P (Narrador &lt; Personaje)</text>

    <!-- Geometric Optical Diagram -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="300" height="110" fill="#FAF9F5" stroke="#D7D9D6" stroke-width="0.5" rx="2" />
      <!-- Objective External Box -->
      <polygon points="40,55 180,25 180,85" class="optic-ext" />
      <rect x="25" y="45" width="20" height="20" rx="2" fill="#071B33" />
      <text x="35" y="78" font-family="DM Mono" font-size="10" fill="#071B33" text-anchor="middle">CÁMARA</text>
      <circle cx="230" cy="55" r="8" fill="#D7D9D6" stroke="#071B33" stroke-width="1.5" />
      <text x="230" y="78" font-family="DM Mono" font-size="10" fill="#071B33" text-anchor="middle">PERSONAJE</text>
      <text x="150" y="102" font-family="DM Mono" font-size="10" fill="#5C636C" text-anchor="middle">SOLO CONDUCTAS VISIBLES</text>
    </g>

    <!-- Descriptions -->
    <g transform="translate(20, 270)">
      <text x="0" y="18" class="body-text">El narrador actúa como un registro ocular neutro.</text>
      <text x="0" y="38" class="body-text">Registra palabras y movimientos visibles, pero jamás</text>
      <text x="0" y="58" class="body-text">revela motivaciones ni pensamientos internos.</text>

      <line x1="0" y1="75" x2="300" y2="75" class="grid-line" />

      <text x="0" y="95" class="body-meta">RÉGIMEN: Neutralidad conductista</text>
      <text x="0" y="115" class="body-meta">ALCANCE: Estrictamente exterior</text>
      <text x="0" y="135" class="body-meta" style="fill:#123C69; font-weight:600;">EJEMPLO: Hemingway / Hammett</text>
    </g>
  </g>

  <!-- Footer Technical Annotation -->
  <text x="70" y="628" class="mono-label" style="font-size:11px;">● GEOMETRÍA PERCEPTUAL DE LA NARRACIÓN · MSC. ALEJANDRO CÓRDOVA · SISTEMA HUMAN / SYSTEM</text>
</svg>